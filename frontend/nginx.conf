server {
  listen 80;
  root /usr/share/nginx/html;

  # gRPC-Web calls (/lkube.v1.<Service>/<Method>) go to the Rust server over HTTP/1.1.
  location ~ ^/lkube\.v1\. {
    proxy_pass http://lkube-server:50051;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Watch is a server stream: never buffer, keep it open.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
