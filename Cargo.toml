[package]
name = "lkube"
version = "0.1.0"
edition = "2021"
description = "A lightweight Kubernetes-like container orchestrator with a gRPC API"
license = "MIT"
default-run = "lkube-server"

[[bin]]
name = "lkube-server"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
mongodb = "3"
bson = "2"
bollard = "0.17"
tower-http = { version = "0.6", features = ["cors"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Password hashing is deliberately expensive; keep it fast in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
